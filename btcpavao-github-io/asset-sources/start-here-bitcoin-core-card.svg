<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Start Here with Bitcoin Core</title>
  <desc id="description">A BTC Pavao social card for the beginner Bitcoin Core exercise.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="0.56" stop-color="#f8f3e9"/>
      <stop offset="1" stop-color="#e9f0ef"/>
    </linearGradient>
    <radialGradient id="sun" cx="0" cy="0" r="1" gradientTransform="translate(1035 80) rotate(135) scale(430 350)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7931a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f7931a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#2b2118" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="42" fill="url(#background)"/>
  <rect width="1200" height="630" rx="42" fill="url(#sun)"/>
  <path d="M0 524C192 468 340 488 494 546c154 58 330 50 470-4 78-30 157-42 236-38v126H0Z" fill="#ead9be" fill-opacity="0.42"/>
  <path d="M0 574c190-48 354-35 514 11 181 52 316 19 440-11 91-22 173-28 246-19v75H0Z" fill="#d9e6e2" fill-opacity="0.7"/>

