    <text y="174" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="750" fill="#241c16">Bitcoin Core</text>
    <text y="242" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#51483f">No real bitcoin. One calm first exercise.</text>
  </g>

