    <text x="96" y="51" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#241c16">Pavao</text>
  </g>

  <g transform="translate(72 176)">
    <text font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="2.2" fill="#b96b00">BITCOIN CORE · FIRST PRACTICE</text>
